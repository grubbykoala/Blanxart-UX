<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 106" fill="none">
  <!--
    Cacao pod icon — estilo flat color, compatible con cualquier fondo oscuro.
    Uso: como src de <img> o <svg> inline donde necesites el icono de cacao.
    Viewbox 80×106 (proporción ~3:4, más alto que ancho como el fruto real).
  -->

  <!-- Tallo: pequeña curva en la parte superior -->
  <path
    d="M40 13 C40 9 42 6 43 4"
    stroke="#3A1C0C"
    stroke-width="3.5"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Forma principal del fruto -->
  <path
    d="M40 14
       C 59 14, 71 30, 71 54
       C 71 78, 59 96, 40 96
       C 21 96,  9 78,  9 54
       C  9 30, 21 14, 40 14 Z"
    fill="#CC7B3C"
    stroke="#3A1C0C"
    stroke-width="5"
    stroke-linejoin="round"
  />

  <!-- Costillas — clipeadas al contorno del fruto (4 líneas → 5 secciones) -->
  <defs>
    <clipPath id="cacao-clip">
      <path d="M40 14 C59 14 71 30 71 54 C71 78 59 96 40 96 C21 96 9 78 9 54 C9 30 21 14 40 14 Z"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cacao-clip)" stroke="#3A1C0C" stroke-width="3.2" stroke-linecap="round">
    <!-- 4 costillas a 1/5, 2/5, 3/5, 4/5 del ancho interno -->
    <!-- ancho total: x=9..71 = 62px → secciones de 12.4px cada una -->
    <line x1="21.4" y1="0"   x2="21.4" y2="106"/>
    <line x1="33.8" y1="0"   x2="33.8" y2="106"/>
    <line x1="46.2" y1="0"   x2="46.2" y2="106"/>
    <line x1="58.6" y1="0"   x2="58.6" y2="106"/>
  </g>

  <!-- Redibujamos el contorno encima para cubrir las costillas en los bordes -->
  <path
    d="M40 14
       C 59 14, 71 30, 71 54
       C 71 78, 59 96, 40 96
       C 21 96,  9 78,  9 54
       C  9 30, 21 14, 40 14 Z"
    fill="none"
    stroke="#3A1C0C"
    stroke-width="5"
    stroke-linejoin="round"
  />
</svg>
